[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "localhost"
version = "0.1.0"
description = "Find, set up, check and connect local LLMs, using the localhost directory."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
localhost = "localhost_cli.cli:main"

[tool.setuptools]
packages = ["localhost_cli"]
